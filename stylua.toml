# Mirrors the ESLint style used for the TypeScript sources: tabs, single quotes, braces everywhere.
syntax = "LuaJIT"
column_width = 140
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferSingle"
call_parentheses = "Always"
collapse_simple_statement = "Never"
space_after_function_names = "Never"

[sort_requires]
enabled = false
